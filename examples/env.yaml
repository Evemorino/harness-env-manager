# henv 示例清单 —— spec §4 的完整形态。
# 密钥永远以 ${VAR} 引用出现，manifest 解析阶段拒绝任何字面量。本文件不含真实密钥。
version: 1

harnesses:
  claude-code: { enabled: true }
  codex:       { enabled: true }
  kimi-code:   { enabled: true }

skills:
  dingtalk-mail:
    source: agents-dir          # 已在 ~/.agents/skills，只做登记 + 链接分发
  superpowers:
    source: git
    repo: obra/superpowers
    path: skills                # 仓库内子目录（monorepo 型）
    ref: v6.3.0                 # ref 就是锁
  my-draft:
    source: local
    path: ~/dev/skills/my-draft

mcps:
  context7:
    command: npx
    args: ["-y", "@upstash/context7-mcp"]
    env:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
    targets: all

plugins:
  superpowers-bundle:
    source: claude-marketplace
    marketplace: obra/superpowers-marketplace
    entry: superpowers          # 跨 harness 身份只认 entry 名（spec §2.1 第 3 条）
    # degrade 策略在 Plan A 只是声明性占位（plugin 尚未拆解，Plan B 拆解落地后才生效）。
    degrade:
      hooks: report
      commands: report
