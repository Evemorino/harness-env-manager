# henv 示例清单 —— spec §4 的完整形态。
# 密钥永远以 ${VAR} 引用出现，manifest 解析阶段拒绝任何字面量。本文件不含真实密钥。
version: 1

harnesses:
  claude-code: { enabled: true }
  codex:       { enabled: true }
  kimi-code:   { enabled: true }

skills:
  dingtalk-mail:
    source: agents-dir          # 已在 ~/.agents/skills，只做登记 + 链接分发
  superpowers:
    source: git
    repo: obra/superpowers
    path: skills                # 仓库内子目录（monorepo 型）
    ref: v6.3.0                 # ref 就是锁
  my-draft:
    source: local
    path: ~/dev/skills/my-draft

mcps:
  context7:
    command: npx
    args: ["-y", "@upstash/context7-mcp"]
    env:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
    targets: all

plugins:
  superpowers-bundle:
    source: claude-marketplace
    marketplace: obra/superpowers-marketplace
    entry: superpowers          # 跨 harness 身份只认 entry 名（spec §2.1 第 3 条）
    source_harness: claude-code # 从这家已装的 bundle 取内容；写了就是请求拆解（§9.5），
                                # 交付目标 = targets − 这家
    # degrade 只在写了 source_harness: 的条目上生效：拆出后目标 harness 吃不下、
    # 但内容已经拆出来的那些能力，按这里的策略进报告（report）或静默丢弃（skip）。
    degrade:
      hooks: report
      commands: report
